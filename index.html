<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro AI - Volatility & Jump</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a1128;color:white;padding:15px}
.header{text-align:center;margin:20px 0}
.header h1{font-size:44px}.header p{color:#00e5ff}
.card{background:#101b3b;border:1px solid #1a2a5a;border-radius:16px;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.label{font-size:10px;color:#6b82b5;margin-bottom:6px}
.input{background:#0a1128;border:1px solid #00e5ff;border-radius:10px;padding:10px}
.input input{background:transparent;border:none;color:white;font-size:18px;width:100%;text-align:right;outline:none}
.globe{width:200px;height:200px;margin:18px auto;background:radial-gradient(circle at 30% 30%, #00e5ff, #0a1128);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px #00e5ff66;border:1px solid #00e5ff}
.badge{border:1px solid #00e5ff;border-radius:20px;padding:8px 18px;text-align:center;color:#00e5ff;margin:10px auto;width:fit-content}
.table{width:100%;margin-top:10px;border-collapse:collapse;font-size:12px}
.table th{color:#6b82b5;font-weight:400;padding:8px 4px;border-bottom:1px solid #1a2a5a}
.table td{padding:10px 4px;border-bottom:1px solid #1a2a5a33}
.bull{color:#00ff88}.bear{color:#ff4d6d}.neutral{color:#ffcc00}
.btn{width:100%;background:linear-gradient(90deg,#00e5ff,#00c2d1);color:#0a1128;border:none;border-radius:16px;padding:18px;font-size:19px;font-weight:800;margin-top:14px}
.btn2{width:100%;background:#1a2a5a;color:white;border:none;border-radius:16px;padding:14px;margin-top:8px;display:none}
.log{background:#0a1128;border:1px solid #1a2a5a;border-radius:12px;padding:10px;height:130px;overflow-y:auto;font-size:11px;font-family:monospace;margin-top:10px}
.metrics{display:flex;gap:8px;margin-top:10px}
.metrics div{background:#101b3b;border-radius:12px;padding:10px;flex:1;text-align:center}
.metrics b{display:block;font-size:18px}
select{width:100%;background:#0a1128;color:white;border:1px solid #00e5ff;border-radius:10px;padding:10px}
</style>
</head>
<body>
<div class="header"><h1>🤖 Pro AI</h1><p>Volatility & Jump indices</p></div>
<div class="card">
<div class="grid">
<div><div class="label">BASE STAKE (USD)</div><div class="input"><input id="stake" type="number" value="0.5"></div></div>
<div><div class="label">RECOVER</div><div class="input"><input id="recover" type="number" value="2"></div></div>
<div><div class="label">TAKE PROFIT (USD)</div><div class="input"><input id="tp" type="number" value="0.6"></div></div>
<div><div class="label">STOP LOSS</div><div class="input"><input id="sl" type="number" value="0.7"></div></div>
</div>
<div style="margin-top:10px"><div class="label">DERIV API TOKEN - USE DEMO!</div><div class="input"><input id="token" type="password" placeholder="Paste DEMO token" style="text-align:left"></div></div>
<div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div><div class="label">STRATEGY</div><select id="strategy"><option>Over 2 / Under 8 (Best)</option><option>Over 2</option><option>Under 8</option></select></div>
<div><div class="label">MAX MARTI</div><select id="maxmarti"><option>1</option><option selected>2</option><option>3</option></select></div>
</div>
</div>
<div class="globe"><b>PRO AI</b></div>
<div class="badge">▼ Over 2 / Under 8 filter</div>
<div class="metrics">
<div><span style="font-size:10px;color:#6b82b5">PROFIT</span><b id="profit">$0.00</b></div>
<div><span style="font-size:10px;color:#6b82b5">STAKE</span><b id="curStake">$0.50</b></div>
<div><span style="font-size:10px;color:#6b82b5">STATUS</span><b id="status" style="font-size:11px">Idle</b></div>
</div>
<table class="table" id="scanTable"><tr><th>INDEX</th><th>OVER%</th><th>SIGNAL</th><th>STATUS</th></tr></table>
<button class="btn" id="startBtn">▶ Scan & start</button>
<button class="btn2" id="stopBtn">⏹ Stop Bot</button>
<div class="log" id="log">Ready. For $10 account, keep Max Marti = 2<br></div>
<script>
let ws,running=false,profit=0,curStake=0.5,marti=0,ticks={}
const markets=["R_10","R_25","R_50","R_75","R_100","JD10","JD25"]
function logM(m){document.getElementById('log').innerHTML=`<div>[${new Date().toLocaleTimeString()}] ${m}</div>`+document.getElementById('log').innerHTML}
function analyze(sym){const d=ticks[sym]||[];if(d.length<50)return null;const over2=d.filter(x=>x>2).length/d.length*100;return{over2,signal:over2>=62?"Bullish":over2<=38?"Bearish":"Neutral",type:over2>=62?"DIGITOVER":over2<=38?"DIGITUNDER":null,barrier:over2>=62?2:8}}
function updateTable(){let h='<tr><th>INDEX</th><th>OVER%</th><th>SIGNAL</th><th>STATUS</th></tr>';markets.forEach(m=>{const a=analyze(m);if(!a){h+=`<tr><td>${m}</td><td>...</td><td>Scanning</td><td>...</td></tr>`;return}const c=a.signal=="Bullish"?"bull":a.signal=="Bearish"?"bear":"neutral";h+=`<tr><td>${m}</td><td>${a.over2.toFixed(0)}%</td><td class="${c}">${a.signal}</td><td>${a.signal!="Neutral"?"● Active":"○ Watch"}</td></tr>`});document.getElementById('scanTable').innerHTML=h}
async function buy(sym,type,barrier,stake){return new Promise((res,rej)=>{ws.send(JSON.stringify({buy:1,price:stake,parameters:{amount:stake,basis:"stake",contract_type:type,barrier:barrier,currency:"USD",duration:1,duration_unit:"t",symbol:sym}}));const h=(e)=>{const d=JSON.parse(e.data);if(d.proposal_open_contract&&d.proposal_open_contract.is_sold){ws.removeEventListener('message',h);res(d.proposal_open_contract.profit)}if(d.error){ws.removeEventListener('message',h);rej(d.error.message)}};ws.addEventListener('message',h)})}
document.getElementById('startBtn').onclick=()=>{const token=document.getElementById('token').value.trim();if(!token){alert("Paste DEMO API Token!");return}curStake=parseFloat(document.getElementById('stake').value);const recover=parseFloat(document.getElementById('recover').value);const tp=parseFloat(document.getElementById('tp').value);const sl=parseFloat(document.getElementById('sl').value);const maxM=parseInt(document.getElementById('maxmarti').value);running=true;profit=0;marti=0;document.getElementById('startBtn').style.display='none';document.getElementById('stopBtn').style.display='block';document.getElementById('status').textContent='Running';ticks={};markets.forEach(m=>ticks[m]=[]);ws=new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');ws.onopen=()=>{ws.send(JSON.stringify({authorize:token}));logM("Connected...")};ws.onmessage=async(e)=>{const data=JSON.parse(e.data);if(data.authorize){logM(`Auth OK $${data.authorize.balance} ${data.authorize.loginid}`);markets.forEach(m=>{ws.send(JSON.stringify({ticks_history:m,count:100,end:"latest",style:"ticks"}));ws.send(JSON.stringify({ticks:m,subscribe:1}))})}if(data.history){ticks[data.echo_req.ticks_history]=data.history.prices.map(p=>parseInt(String(p).slice(-1)));updateTable()}if(data.tick&&running){const sym=data.tick.symbol;const digit=parseInt(String(data.tick.quote).slice(-1));ticks[sym].push(digit);if(ticks[sym].length>100)ticks[sym].shift();updateTable();const a=analyze(sym);if(a&&a.type){document.getElementById('status').textContent=`Trading ${sym}`;try{const p=await buy(sym,a.type,a.barrier,curStake);profit+=p;document.getElementById('profit').textContent=`$${profit.toFixed(2)}`;if(p>0){logM(`✅ WIN ${sym} +$${p.toFixed(2)} Total $${profit.toFixed(2)}`);curStake=parseFloat(document.getElementById('stake').value);marti=0}else{marti++;if(marti>=maxM){logM(`❌ LOSS $${p.toFixed(2)} Reset`);curStake=parseFloat(document.getElementById('stake').value);marti=0}else{curStake*=recover;logM(`❌ LOSS $${p.toFixed(2)} Next $${curStake.toFixed(2)}`)}}document.getElementById('curStake').textContent=`$${curStake.toFixed(2)}`;if(profit>=tp){logM(`🎯 TP $${profit.toFixed(2)}`);running=false}if(profit<=-sl){logM(`🛑 SL $${profit.toFixed(2)}`);running=false}}catch(err){logM(`Err ${err}`)}}}};document.getElementById('stopBtn').onclick=()=>{running=false;if(ws)ws.close();document.getElementById('startBtn').style.display='block';document.getElementById('stopBtn').style.display='none';document.getElementById('status').textContent='Stopped'}
</script>
</body>
  </html>
